; Fairhaven (UEGT2) input configuration.
;
; The only thing that has to live here is the switch to Enhanced Input. Without
; these two classes the player controller receives a plain UInputComponent,
; Cast<UEnhancedInputComponent> fails, and NOTHING is bound - the game looks
; fine and is completely unplayable.
;
; Actual bindings are built in code: see Source/UEGT2/Private/Player/
; UEGT2InputConfig.cpp. They are not assets, so they stay diffable and
; rebindable at runtime.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bEnableMouseSmoothing=False
bCaptureMouseOnLaunch=True
bDefaultViewportMouseLock=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
bAlwaysShowTouchInterface=False
FOVScale=0.011110
DoubleClickTime=0.200000

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
bEnableUserSettings=False
