; Fairhaven (UEGT2) engine configuration.
; Target: Windows / DX12 / SM6, RTX 3060-class GPU at 1920x1080.
; Rendering is fully dynamic (Lumen + Virtual Shadow Maps). Static lighting is
; disabled on purpose: every mesh in this project is generated procedurally and
; has no authored lightmap UVs.

[SystemSettings]
; Lumen caches lighting with a fixed pre-exposure offset in EV. The default (4)
; covers about [-8, 12] EV; bright daylight here sits near 14, which clips and
; puts a red warning on screen. 8 covers roughly [-4, 16].
r.EyeAdaptation.CachedLightingPreExposure=8

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/L_Fairhaven
GameDefaultMap=/Game/Maps/L_Fairhaven
GlobalDefaultGameMode=/Script/UEGT2.UEGT2GameMode
GameInstanceClass=/Script/UEGT2.UEGT2GameInstance

[/Script/Engine.Engine]
GameUserSettingsClassName=/Script/UEGT2.UEGT2GameUserSettings
NearClipPlane=5.000000

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AntiAliasing=4
r.AntiAliasingMethod=4
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=0
r.Lumen.TraceMeshSDFs=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.Nanite.ProjectEnabled=True
r.SkinCache.CompileShaders=True
r.VelocityOutputPass=1
r.CustomDepth=3
r.PostProcessing.PropagateAlpha=False
r.Mobile.ShadingPath=0
r.MSAACount=0
VirtualTextureStreaming=False
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
bDefaultParticleCutouts=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
